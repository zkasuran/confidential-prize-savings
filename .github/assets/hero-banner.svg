<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050a18"/>
      <stop offset="50%" style="stop-color:#0f1630"/>
      <stop offset="100%" style="stop-color:#050a18"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c5cff"/>
      <stop offset="50%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c5cff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#7c5cff;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="40%">
      <stop offset="0%" style="stop-color:#7c5cff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#7c5cff;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="60%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)"/>
  <rect width="1200" height="400" fill="url(#glow1)"/>
  <rect width="1200" height="400" fill="url(#glow2)"/>
  
  <!-- Grid lines -->
  <g opacity="0.08" stroke="#7c5cff" stroke-width="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>
  
  <!-- Floating particles -->
  <circle cx="150" cy="100" r="3" fill="#7c5cff" opacity="0.6"/>
  <circle cx="300" cy="280" r="2" fill="#22d3ee" opacity="0.5"/>
  <circle cx="500" cy="50" r="2.5" fill="#a78bfa" opacity="0.4"/>
  <circle cx="750" cy="320" r="3" fill="#22d3ee" opacity="0.5"/>
  <circle cx="900" cy="80" r="2" fill="#7c5cff" opacity="0.6"/>
  <circle cx="1050" cy="250" r="2.5" fill="#a78bfa" opacity="0.4"/>
  <circle cx="100" cy="300" r="1.5" fill="#22d3ee" opacity="0.3"/>
  <circle cx="1100" cy="100" r="2" fill="#7c5cff" opacity="0.5"/>
  
  <!-- Decorative lines connecting particles -->
  <line x1="150" y1="100" x2="300" y2="280" stroke="#7c5cff" stroke-width="0.3" opacity="0.2"/>
  <line x1="500" y1="50" x2="750" y2="320" stroke="#22d3ee" stroke-width="0.3" opacity="0.2"/>
  <line x1="900" y1="80" x2="1050" y2="250" stroke="#a78bfa" stroke-width="0.3" opacity="0.2"/>
  
  <!-- Lock icon -->
  <g transform="translate(560, 100)">
    <rect x="15" y="30" width="50" height="40" rx="6" fill="none" stroke="url(#text-grad)" stroke-width="2.5"/>
    <path d="M25 30V20C25 10 55 10 55 20V30" fill="none" stroke="url(#text-grad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="40" cy="48" r="4" fill="#22d3ee"/>
    <line x1="40" y1="52" x2="40" y2="60" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="210" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="800" fill="url(#text-grad)">Confidential Prize Savings</text>
  
  <!-- Subtitle -->
  <text x="600" y="250" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#8b9cc7">The first fully private no-loss lottery on Fully Homomorphic Encryption</text>
  
  <!-- Divider line -->
  <rect x="400" y="275" width="400" height="1" fill="url(#line-grad)"/>
  
  <!-- Tech badges -->
  <g transform="translate(380, 300)">
    <rect x="0" y="0" width="90" height="28" rx="14" fill="rgba(124,92,255,0.15)" stroke="#7c5cff" stroke-width="0.5"/>
    <text x="45" y="18" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#a78bfa">Zama FHEVM</text>
    
    <rect x="105" y="0" width="90" height="28" rx="14" fill="rgba(34,211,238,0.1)" stroke="#22d3ee" stroke-width="0.5"/>
    <text x="150" y="18" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#22d3ee">ERC-7984</text>
    
    <rect x="210" y="0" width="90" height="28" rx="14" fill="rgba(52,211,153,0.1)" stroke="#34d399" stroke-width="0.5"/>
    <text x="255" y="18" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#34d399">No-Loss</text>
    
    <rect x="315" y="0" width="90" height="28" rx="14" fill="rgba(124,92,255,0.1)" stroke="#7c5cff" stroke-width="0.5"/>
    <text x="360" y="18" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#a78bfa">Sepolia</text>
  </g>
  
  <!-- Border -->
  <rect x="0.5" y="0.5" width="1199" height="399" rx="16" fill="none" stroke="rgba(124,92,255,0.2)" stroke-width="1"/>
</svg>
