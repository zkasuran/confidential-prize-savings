specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ConfidentialPrizePool
    network: sepolia
    source:
      address: "0x89EE395e44bD7F7401D47805550f9dc424b9D553"
      abi: ConfidentialPrizePool
      startBlock: 7000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Participant
        - DrawRound
        - DepositEvent
        - WithdrawalEvent
        - SponsorEvent
        - PoolStats
      abis:
        - name: ConfidentialPrizePool
          file: ../hardhat/artifacts/contracts/ConfidentialPrizePool.sol/ConfidentialPrizePool.json
      eventHandlers:
        - event: Deposited(indexed address)
          handler: handleDeposited
        - event: Withdrawn(indexed address)
          handler: handleWithdrawn
        - event: PrizeSponsored(indexed address)
          handler: handlePrizeSponsored
        - event: DrawStarted(indexed uint256,bytes32)
          handler: handleDrawStarted
        - event: DrawFinalized(indexed uint256,indexed uint64)
          handler: handleDrawFinalized
      file: ./src/mapping.ts
